<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BAPTO Master Admin Login</title>
  <link rel="stylesheet" href="/admin.css?v=20260923-1">
</head>
<body>
  <div id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="admin-mark">BAP</div>
      <h1>Master Admin</h1>
      <p>Sign in to manage BAPTO website content.</p>
      <label>Email
        <input id="login-email" type="email" required autocomplete="username" value="bapnationalcom@gmail.com">
      </label>
      <label>Password
        <input id="login-password" type="password" required autocomplete="current-password">
      </label>
      <div class="login-actions">
        <button type="submit">Sign In</button>
        <button id="test-connection-btn" type="button" class="secondary-btn">Test Connection</button>
      </div>
      <button id="forgot-password-btn" type="button" class="link-button">Forgot password?</button>
      <p id="login-message" class="form-message" aria-live="polite"></p>
      <a href="/">← Back to website</a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js?v=20260923-1"></script>
  <script src="/admin.js?v=20260923-1"></script>
</body>
</html>
