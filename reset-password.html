<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset BAPTO Admin Password</title>
  <link rel="stylesheet" href="/admin.css?v=20260923-1">
</head>
<body>
  <div class="login-shell">
    <form id="reset-password-form" class="login-card">
      <div class="admin-mark">BAP</div>
      <h1>Set New Password</h1>
      <p>Choose a new password for the Master Admin account.</p>
      <label>New Password
        <input id="new-password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirm Password
        <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <div class="login-actions">
        <button type="submit">Update Password</button>
      </div>
      <p id="reset-message" class="form-message" aria-live="polite"></p>
      <a href="/admin">← Back to admin login</a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js?v=20260923-1"></script>
  <script src="/reset-password.js?v=20260923-1"></script>
</body>
</html>
